<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="피싱아이">
  <title>피싱아이</title>
  <!--
    눈 앞에 낚싯바늘이 드리워진 모양.
    피싱(phishing)의 '낚는다'와 '지켜본다'를 겹쳤다.
    바늘이 눈꺼풀을 지나는 자리는 배경색 테두리(halo)로 끊어 앞뒤를 구분한다.
    halo 색은 --icon-halo 로 바꾼다 (기본 흰색). 배경과 다르면 테가 드러난다.
    미늘은 넣지 않았다. 작은 크기에서 뭉쳐 보이기만 하고 형태를 흐린다.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 눈 -->
    <path d="M6 34C17 20 43 20 54 34 43 48 17 48 6 34Z" stroke="currentColor" stroke-width="4"/>
    <!-- 눈동자 -->
    <circle cx="21" cy="34" r="7" fill="currentColor" stroke="none"/>
    <!-- 바늘이 지나는 자리를 비운다 -->
    <path d="M45 7v20c0 12-14 13-14 4.5" stroke="var(--icon-halo, #fff)" stroke-width="10"/>
    <!-- 낚싯줄과 바늘 -->
    <path d="M45 7v20c0 12-14 13-14 4.5" stroke="currentColor" stroke-width="4"/>
  </g>
</svg>
